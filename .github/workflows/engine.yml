name: Engine checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Format, lint, and test (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo +stable test --workspace --all-targets
